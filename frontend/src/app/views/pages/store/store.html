<main id="grid">
    <section id="grid-header">
        <h1>Our fluffy haven</h1>
        <div class="grid-header__actions">
            <div class="input search">
                
                <input type="text" placeholder="Search" class="grid-header__search">
                <button class="button-icon">
                    <div class="icon" [style.width.px]="22" [style.height.px]="22" [innerHTML]="`${cdn}/icons/functional/functional-search.svg` | fetchAsset ">
                    </div>
                </button>
            </div>
            <div class="input dropdown">
                <custom-select id="store-sort" [checkmark]="true" optionLabel="label" [showClear]="true" placeholder="Sort by"/>
            </div>
            <div class="input filter">
                <button><span></span><i class="icon" [style.width.px]="17" [style.height.px]="12" [innerHTML]="`${cdn}/icons/functional/filter.svg` | fetchAsset "></i></button>
            </div>
        </div>
        <div class="grid-header__count">
        </div>
    </section>

    <section id="grid-content"> 

        <aside id="filter__menu active">
            <div class="filter__header">

                <div class="container__two-elements space-between">
                    <h2 class="filter__title">Filters</h2>
                    <button class="button-icon close"><div class="icon" [style.width.px]="20" [style.height.px]="20" [innerHTML]="`${cdn}/icons/functional/close.svg` | fetchAsset "></div></button>
                </div>

                <div class="container__two-elements space-between">
                    <div class="filter-text__filter-count"></div>
                    <p id="clear-filters">Clear All</p>
                </div>

            </div>
            <div class="filter__body">
                


            </div>

        </aside>

        <div class="grid__items">
            <!-- Loading state -->
            <div class="grid__loading">
                <div class="loading-spinner"></div>
                <p>Loading puppies...</p>
            </div>

            <!-- Error state -->
            <div class="grid__error" style="display: none;">
                <p></p>
                <button>Try Again</button>
            </div>

            <!-- Empty state -->
            <div class="grid__empty" style="display: none;">
                <div class="icon" [style.width.px]="64" [style.height.px]="64" [innerHTML]="cdn + '/icons/functional/paw.svg' | fetchAsset"></div>
                <h3>No puppies found</h3>
                <p>Try adjusting your filters to find more puppies.</p>
                <button class="secondary">Clear Filters</button>
            </div>

            <!-- Dog cards grid -->
            <div class="grid__cards">
                
            </div>
        </div>

    </section>

    <section id="grid-pagination">

    </section>
</main>
