<section class="hero">

  <div class="hero__content">

    <div class="hero__text">
      <h1 class="hero__title">I can't wait to meet you!</h1>
      <p class="hero__subtitle">Your new family member is patiently waiting</p>
    </div>

    <div class="hero__action">
      <form class="hero__search-form">
        <input type="text" class="hero__search" placeholder="Search by breed or puppy name"/>
        <button class="button-icon"><svg width="20" height="20"><use href="icons/function-icons.svg#search"></use></svg></button>
      </form>
      <a data-button="true" href="#test">Browse all puppies</a>
    </div>

    <div class="hero__social-proof">
      <svg class="social-proof__logo" viewBox="0 0 131 30"><use href="graphics/social-proof.svg#trustpilot__logo"></use></svg>
      <svg class="social-proof__logo" viewBox="0 0 172 33"><use href="graphics/social-proof.svg#trustpilot__rating"></use></svg>
      <p class="social-proof__text">2,100+ reviews</p>
    </div>

  </div>

  <div class="hero__graphic">
    <svg class="hero__graphic-background" viewBox="0 0 1440 829"><use href="graphics/hero-images.svg#hero__background"></use></svg>
    <img class="hero__graphic-dog" src="graphics/hero-dog.png"/>
  </div>

</section>

<section class="social-proof__hero">
  <div class="social-proof__container">
    <p class="social-proof__text">As seen on</p>
    <div class="social-proof__logo-container">
      <svg class="social-proof__logo" viewBox="0 0 114 43"><use href="graphics/hero-images.svg#social-proof__akc"></use></svg>
      <svg class="social-proof__logo" viewBox="0 0 71 39"><use href="graphics/hero-images.svg#social-proof__gma"></use></svg>
      <svg class="social-proof__logo" viewBox="0 0 125 27"><use href="graphics/hero-images.svg#social-proof__maw"></use></svg>
      <svg class="social-proof__logo" viewBox="0 0 63 37"><use href="graphics/hero-images.svg#social-proof__fnf"></use></svg>
    </div>
  </div>
</section>
