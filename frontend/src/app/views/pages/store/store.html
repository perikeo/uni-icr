<main id="grid">
    <section id="grid-header">
        <h1>[FILTER TEXT]</h1>
        <div class="grid-header__actions">
            <div class="input">
                <input type="text" placeholder="Cocker Spaniel" class="grid-header__search"><i href=""></i>
            </div>
            <div class="input">
                <select class="grid-header__sort">
                    <option value="default">Sort By</option>
                    <option value="price-asc">Sort By Price - Asc</option>
                    <option value="price-desc">Sort By Price - Desc</option>
                    <option value="price-desc">Youngest</option>
                    <option value="price-desc">Oldest</option>
                    <option value="price-desc">Most Popular</option>
                    <option value="price-desc">Best Rated</option>
                </select>
                <i class="icon" [style.width.px]="10" [style.height.px]="7" [innerHTML]="`${cdn}/icons/functional/dropdown.svg` | fetchAsset "></i>
            </div>
            <div class="input">
                <lp-select class="grid-header__sort"
                [options]="sortOptions"
                placeholder="Sort By"
                [(ngModel)]="sort"
                (valueChange)="onSort(sort)">
                </lp-select>
            </div>
            <div class="input">
                <button>Filters <i class="icon" [style.width.px]="17" [style.height.px]="12" [innerHTML]="`${cdn}/icons/functional/filter.svg` | fetchAsset "></i></button>
            </div>
        </div>
    </section>

    <section id="grid-content">

    </section>

    <section id="grid-pagination">

    </section>
</main>
