<main id="grid">
    <section id="grid-header">
        <h1>[FILTER TEXT]</h1>
        <div class="grid-header__actions">
            <div class="input search">
                <input type="text" placeholder="Cocker Spaniel" class="grid-header__search"><button class="button-icon"><div class="icon" [style.width.px]="22" [style.height.px]="22" [innerHTML]="`${cdn}/icons/functional/functional-search.svg` | fetchAsset "></div></button>
            </div>
            <div class="input dropdown">
                <custom-select id="store-sort" [options]="options" [(ngModel)]="selectedOption" [checkmark]="true" optionLabel="label"  [showClear]="true" placeholder="Select a City"/>
            </div>
            <div class="input filter">
                <button (click)="toggleFilterMenu();"><span>{{ filterMenuButtonLabel() }}</span><i class="icon" [style.width.px]="17" [style.height.px]="12" [innerHTML]="`${cdn}/icons/functional/filter.svg` | fetchAsset "></i></button>
            </div>
        </div>
    </section>

    <section id="grid-content"> 

        <aside id="filter__menu" [class.active]="filterMenuActive()">
            <div class="filter__header">
                <h2>
                    Filters
                    <span class="filter-text__filter-count" *ngIf="appliedFilterCount()">
                        ({{ appliedFilterCount() }} applied)
                    </span>
                </h2>
                <div class="container__two-elements">
                    <p id="clear-filters" (click)="clearFilters();">Clear All</p>
                    <button class="button-icon close" (click)="toggleFilterMenu();"><div class="icon" [style.width.px]="20" [style.height.px]="20" [innerHTML]="`${cdn}/icons/functional/close.svg` | fetchAsset "></div></button>
                </div>
            </div>
            <div class="filter__body">
                @for (group of filterGroups; track group.key) {
                    <filter-accordion
                        [title]="group.title"
                        [options]="group.options"
                        [startExpanded]="group.startExpanded ?? true"
                        [selectedValues]="filters()[group.key]"
                        (selectedValuesChange)="onFilterSelectedValuesChange(group.key, $event)">
                    </filter-accordion>
                }

                <div class="filter__footer">
                    <button class="button button--primary" (click)="applyFilters();">
                        Show Products
                        <span class="filter-text__product-count" *ngIf="appliedProductCount() !== null">
                            {{ appliedProductCount() }}
                        </span>
                    </button>
                </div>

            </div>

        </aside>

        <div class="grid__items">
            
        </div>

    </section>

    <section id="grid-pagination">

    </section>
</main>
